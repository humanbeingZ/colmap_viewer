<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLMAP Viewer</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/matching.css">
    <link rel="stylesheet" href="/static/css/reprojection.css">
</head>
<body>
    <div class="container">
        <div class="controls">
            <h1>COLMAP Viewer</h1>
            <div class="viewer-mode-selection">
                <label for="viewer-mode-select">Viewer Mode:</label>
                <select id="viewer-mode-select">
                    <option value="matches">Feature matches</option>
                    <option value="reprojection">3D reprojection</option>
                </select>
            </div>
            <div id="matching-controls">
                <div class="source-selection" style="display: none;">
                    <label for="source-select">Data Source:</label>
                    <select id="source-select"></select>
                </div>
                <div class="image-selection">
                    <label for="image1-select" class="image-selection-label">
                        <span>Image 1:</span>
                        <span class="image-navigation-keys"><kbd>&larr;</kbd> <kbd>&rarr;</kbd></span>
                    </label>
                    <select id="image1-select"></select>
                    <label for="image2-select" class="image-selection-label">
                        <span>Image 2:</span>
                        <span class="image-navigation-keys"><kbd>&uarr;</kbd> <kbd>&darr;</kbd></span>
                    </label>
                    <select id="image2-select"></select>
                    <div id="generated-pair-options" class="generated-pair-options" hidden>
                        <div id="generated-pair-message"
                             class="generated-pair-message"></div>
                        <label for="pose-neighbor-limit">Maximum generated neighbors:</label>
                        <input id="pose-neighbor-limit" type="number"
                               value="{{ default_pose_neighbors }}" min="1"
                               max="{{ max_pose_neighbors }}" step="1">
                    </div>
                </div>
                <div class="display-options">
                    <label>
                        <input type="checkbox" id="show-markers" checked> Show Markers
                    </label>

                    <label>
                        <input type="checkbox" id="show-only-matched"> Show only matched markers
                    </label>

                    <div class="match-type-options" style="font-size: 0.9em; color: gray; display: flex; align-items: center;">
                        <span style="font-weight: normal; margin-right: 10px;">Match Type:</span>
                        <label style="margin-right: 10px; font-weight: normal;">
                            <input type="checkbox" id="show-inlier-matches" checked> Inlier
                        </label>
                        <label style="font-weight: normal;">
                            <input type="checkbox" id="show-wrong-matches"> Outlier
                        </label>
                    </div>
                </div>
                <div class="action-buttons">
                    <button id="draw-matches">Draw Matches</button>
                    <button id="draw-epipolar">Draw Epipolar Lines</button>
                    <button id="reset-view">Reset View</button>
                </div>
                <div class="match-summary" id="match-summary">
                    <div class="match-summary-title">Match Summary</div>
                    <div id="match-summary-content" class="match-summary-body">
                        Select two images to see match statistics.
                    </div>
                </div>
            </div>

            <div id="reprojection-controls" hidden>
                <div class="image-selection">
                    <label for="reprojection-image-select">Registered image:</label>
                    <select id="reprojection-image-select"></select>
                    <div class="reprojection-navigation">
                        <button id="reprojection-prev" title="Previous image">&#9664; Previous</button>
                        <button id="reprojection-next" title="Next image">Next &#9654;</button>
                    </div>
                </div>
                <div class="display-options reprojection-options">
                    <div class="reprojection-reset-actions">
                        <button id="reprojection-reset-view" type="button"
                                class="reprojection-reset-view">
                            Reset view
                        </button>
                        <button id="reprojection-reset-divider" type="button"
                                class="reprojection-reset-view">
                            Reset divider
                        </button>
                    </div>
                </div>

                <details class="reprojection-disclosure">
                    <summary>Advanced comparison</summary>
                    <div class="reprojection-disclosure-content">
                        <div class="reprojection-option-grid">
                            <div class="reprojection-field">
                                <label for="reprojection-layout">Layout</label>
                                <select id="reprojection-layout">
                                    <option value="split">Split</option>
                                    <option value="side">Side by side</option>
                                </select>
                            </div>
                            <div class="reprojection-field">
                                <label for="reprojection-color">Point color</label>
                                <select id="reprojection-color">
                                    <option value="rgb">RGB</option>
                                    <option value="depth">Depth</option>
                                    <option value="white">White</option>
                                </select>
                            </div>
                            <div class="reprojection-field">
                                <label for="reprojection-point-size">Point size</label>
                                <div class="reprojection-point-size-control">
                                    <input id="reprojection-point-size" type="number"
                                           value="3" min="0.25" max="15" step="0.25"
                                           title="Ctrl + wheel; fractional sizes use supersampling">
                                    <span>px</span>
                                </div>
                            </div>
                            <div class="reprojection-field">
                                <label for="reprojection-split-angle">Divider angle</label>
                                <div class="reprojection-angle-control">
                                    <input id="reprojection-split-angle" type="number"
                                           value="0" min="-180" max="180" step="1">
                                    <span>&deg;</span>
                                </div>
                            </div>
                            <div class="reprojection-field">
                                <label for="reprojection-flip">Input orientation</label>
                                <select id="reprojection-flip">
                                    <option value="none">Unchanged</option>
                                    <option value="horizontal">Flip horizontal</option>
                                    <option value="vertical">Flip vertical</option>
                                    <option value="both">Rotate 180&deg;</option>
                                </select>
                            </div>
                        </div>
                        <div class="reprojection-hint">Ctrl + drag rotates the divider</div>
                    </div>
                </details>

                <details class="reprojection-disclosure reprojection-geometry">
                    <summary>
                        <span>Geometry</span>
                        <span id="reprojection-geometry-summary"
                              class="reprojection-summary-value">COLMAP</span>
                    </summary>
                    <div class="reprojection-disclosure-content">
                        <div id="reprojection-geometry-drop" class="geometry-drop-zone"
                             role="button" tabindex="0">
                            <strong>Drop or select a PLY</strong>
                            <span>Point cloud or mesh</span>
                        </div>
                        <input id="reprojection-geometry-file" type="file"
                               accept=".ply" hidden>
                        <div id="reprojection-geometry-status" class="geometry-status">
                            COLMAP points3D
                        </div>
                        <button id="reprojection-use-colmap" type="button">
                            Use COLMAP points3D
                        </button>
                    </div>
                </details>
                <div id="reprojection-status" class="reprojection-status">
                    Select 3D reprojection mode to load the model.
                </div>
            </div>
        </div>

        <div class="viewer" id="matching-viewer">
            <canvas id="match-canvas" style="position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none;"></canvas>
            <canvas id="epipolar-canvas" class="epipolar-canvas"></canvas>
            <div class="image-panel">
                <canvas id="image1-canvas"></canvas>
            </div>
            <div class="image-panel">
                <canvas id="image2-canvas"></canvas>
            </div>
        </div>

        <div class="reprojection-viewer" id="reprojection-viewer" hidden>
            <div id="reprojection-split" class="reprojection-split">
                <img id="reprojection-cloud" alt="Geometrically projected 3D points">
                <div id="reprojection-input-layer" class="reprojection-input-layer">
                    <img id="reprojection-input" class="reprojection-input" alt="Input image">
                </div>
                <div id="reprojection-divider" class="reprojection-divider"></div>
            </div>
            <div id="reprojection-side" class="reprojection-side" hidden>
                <div class="reprojection-pane">
                    <img id="reprojection-cloud-side" alt="Geometrically projected 3D points">
                </div>
                <div class="reprojection-pane">
                    <img id="reprojection-input-side" class="reprojection-input" alt="Input image">
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/matching/api.js"></script>
    <script src="/static/js/matching/canvas.js"></script>
    <script src="/static/js/matching/epipolar.js"></script>
    <script src="/static/js/matching/app.js"></script>
    <script src="/static/js/shared/viewer_stream.js"></script>
    <script src="/static/js/reprojection/api.js"></script>
    <script src="/static/js/reprojection/split.js"></script>
    <script src="/static/js/reprojection/point_size.js"></script>
    <script src="/static/js/reprojection/interaction.js"></script>
    <script src="/static/js/reprojection/point_request.js"></script>
    <script src="/static/js/reprojection/app.js"></script>
</body>
</html>
